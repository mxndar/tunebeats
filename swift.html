<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TuneBeats - Your favourite music is here</title>
    <link rel="stylesheet" href="swift.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        body {
            background-color: white; /* Set background to white */
        }
        nav ul {
            display: flex;
            align-items: center; /* Vertically align items */
            padding: 10px 20px;
            background-color: #000;
            color: white;
            margin: 0;
        }
        nav ul .brand {
            display: flex;
            align-items: center;
            margin-right: auto; /* Push brand to the left */
        }
        nav ul .brand img {
            height: 40px;
            margin-right: 10px;
        }
        nav ul .brand li {
            list-style: none;
            font-size: 1.5rem;
        }
        nav ul li {
            list-style: none;
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        nav ul li a:hover {
            color: #f0f0f0;
        }
        nav ul li:first-child {
            margin-left: 0; /* Remove left margin from the first item */
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="logo.png" alt="Tunebeats" />TuneBeats</li>
            <li><a href="home.html">Home</a></li>
        </ul>
    </nav>

    <div class="container">

        <div class="songList">
            <h1>Best of Taylor Swift- No Copyright Sounds</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img alt="1" />
                    <span class="songName">You belong to me</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            03:48 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="2" />
                    <span class="songName">2</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            05:09 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="3" />
                    <span class="songName">3</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            04:32 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="4" />
                    <span class="songName">4</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            02:59 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="5" />
                    <span class="songName">5</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            04:15 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="6" />
                    <span class="songName">6</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            04:08 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="7" />
                    <span class="songName">7</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            04:12 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>

    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100" />
        <div class="icons">
            <i class="fa-solid fa-3x fa-backward-step" id="previous"></i>
            <i class="fa-solid fa-3x fa-circle-play" id="masterPlay"></i>
            <i class="fa-solid fa-3x fa-forward-step" id="next"></i>
        </div>
        <div class="songInfo">
            <img src="playing.gif" width="42px" alt="" id="gif" />
            <span id="masterSongName">You belong to me</span>
        </div>
    </div>

    <script src="swift.js"></script>
</body>
</html>
