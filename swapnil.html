<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TuneBeats - Your favourite music is here</title>
    <link rel="stylesheet" href="swapnil.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        body {
            background-color: white; /* Set background to white */
        }
        nav {
            background-color: #000;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between; /* Distribute space between items */
            align-items: center; /* Vertically align items */
        }
        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0;
        }
        nav .brand {
            display: flex;
            align-items: center;
        }
        nav .brand img {
            height: 40px;
            margin-right: 10px;
        }
        nav .brand span {
            font-size: 1.5rem;
        }
        nav ul li {
            margin-left: 20px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        nav ul li a:hover {
            color: #f0f0f0;
        }
        /* Style for the Home link */
        nav ul.right-menu {
            margin-left: auto; /* Push to the right */
        }
        nav ul.right-menu li {
            margin-left: 0; /* Remove left margin for single item */
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">
            <img src="logo.png" alt="Tunebeats" />
            <span>TuneBeats</span>
        </div>
        <ul class="right-menu">
            <li><a href="home.html">Home</a></li>
        </ul>
    </nav>

    <div class="container">

        <div class="songList">
            <h1>Best of Swapnil Bandodkar- No Copyright Sounds</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img alt="1" />
                    <span class="songName">Galavar Khali</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            04:42 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="2" />
                    <span class="songName">2</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            03:51 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="3" />
                    <span class="songName">3</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            05:41 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="4" />
                    <span class="songName">4</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            06:16 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img alt="5" />
                    <span class="songName">5</span>
                    <span class="songlistplay">
                        <span class="timestamp">
                            03:27 <i id="0" class="fa-solid songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>

    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100" />
        <div class="icons">
            <i class="fa-solid fa-3x fa-backward-step" id="previous"></i>
            <i class="fa-solid fa-3x fa-circle-play" id="masterPlay"></i>
            <i class="fa-solid fa-3x fa-forward-step" id="next"></i>
        </div>
        <div class="songInfo">
            <img src="playing.gif" width="42px" alt="" id="gif" />
            <span id="masterSongName">Galavar Khali</span>
        </div>
    </div>

    <script src="swapnil.js"></script>
</body>
</html>
