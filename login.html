<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In to TuneBeats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('bag.png'); /* Replace 'background.jpg' with your image path */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0; /* Ensure no default body margin */
            /* Removed the background gradient */
        }
    </style>
</head>
<body class="h-screen flex justify-center items-center">
    <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
        <h1 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Log In to TuneBeats</h1>
        <form id="signin-form" class="space-y-4">
            <div>
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" name="email" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <div id="email-error" class="text-red-500 text-xs italic" style="display: none;"></div>
            </div>
            <div>
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <div id="password-error" class="text-red-500 text-xs italic" style="display: none;"></div>
            </div>
            <button type="submit" class="bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full"><a href="home.html">Sign In</a></button>
        </form>
        <div class="mt-4 text-center text-gray-600">
            Already signed up? <a href="signin.html" class="text-blue-500 hover:underline">Sign in</a>
        </div>
    </div>
    <script>
        const signinForm = document.getElementById('signin-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');

        function validateEmail() {
            const emailValue = emailInput.value.trim();
            if (emailValue === '') {
                emailError.textContent = 'Email is required';
                emailError.style.display = 'block';
                return false;
            } else if (!/^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/.test(emailValue)) {
                emailError.textContent = 'Invalid email format';
                emailError.style.display = 'block';
                return false;
            } else {
                emailError.style.display = 'none';
                return true;
            }
        }

        function validatePassword() {
            const passwordValue = passwordInput.value.trim();
            if (passwordValue === '') {
                passwordError.textContent = 'Password is required';
                passwordError.style.display = 'block';
                return false;
            } else {
                passwordError.style.display = 'none';
                return true;
            }
        }

        emailInput.addEventListener('input', validateEmail);
        passwordInput.addEventListener('input', validatePassword);

        signinForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const isEmailValid = validateEmail();
            const isPasswordValid = validatePassword();

            if (isEmailValid && isPasswordValid) {
                // Simulate signin success (replace with actual authentication logic)
                console.log('login in successful');
                localStorage.setItem('loggedInEmail', emailInput.value);
                // For demonstration, redirect to the home page after successful sign in
                window.location.href = "home.html"; // Redirect to home page
            } else {
                console.log('login in failed');
            }
        });
    </script>
</body>
</html>
